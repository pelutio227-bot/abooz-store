<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abooz</title>
<style>
  :root { --bg:#F4F4F6; --ink:#0A0A0A; --muted:#55555C; --accent:#FFE600; --card:#fff; --line:#E4E4E8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B0B0D; --ink:#F4F4F5; --muted:#A1A1AA; --card:#17171A; --line:#2A2A2E; } }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system, system-ui, sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; max-width:360px; width:100%; text-align:center }
  .logo { width:64px; height:64px; border-radius:16px; background:var(--accent); color:#0A0A0A; font-weight:800; font-size:34px;
          display:flex; align-items:center; justify-content:center; margin:0 auto 20px }
  h1 { font-size:22px; font-weight:800; margin-bottom:8px }
  p { color:var(--muted); font-size:15px; line-height:1.45; margin-bottom:24px }
  button { width:100%; border:0; border-radius:14px; background:var(--accent); color:#0A0A0A; font-weight:700; font-size:16px; padding:15px; min-height:50px }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">a</div>
    <h1>Keine Verbindung</h1>
    <p>Abooz braucht Internet, um deine Abos zu prüfen. Prüfe WLAN oder mobile Daten.</p>
    <button onclick="location.href='https://abooz.ch/'">Erneut versuchen</button>
  </div>
</body>
</html>
